name: Deploy (manual template)

on:
  workflow_dispatch:
    inputs:
      healthcheck_url:
        description: Optional public URL to check after an external deployment
        required: false
        type: string

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  package:
    name: Build deployable artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=8192
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deploy-dist-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 7
      - name: Healthcheck external deployment (optional)
        if: ${{ inputs.healthcheck_url != '' }}
        run: ./deploy/healthcheck.sh "${{ inputs.healthcheck_url }}"
